[motors_sync]
axes: x,y
#    Axes on which calibration will be performed.
accel_chip: beacon 
#    Accelerometer for vibrations collection: adxl345 / mpu9250 etc.
#encoder_chip_<axis>:
#    Axis, assigned encoder name, for measuring deviations.
#chip_filter: median
#    Filter type for data from the accelerometer: 'median' works well in
#    most cases, but some particularly noisy printers (fans, etc.) may
#    require a more powerful filter - 'kalman'. On lis2dw filters disabled.
#median_size: 3
#    Median filter window size.
#kalman_coeffs: 1.1, 1., 1e-1, 1e-2, .5, 1.
#    Simple coefficients describing the kalman filter.
#microsteps: 16
#    Maximum microstepping displacement of the stepper motor rotor.
#steps_model: linear, 20000, 0
#    Mathematical model and its coefficients representing the dependence
#    of stepper motor microstep displacement on the measured magnitude.
#max_step_size: 3
#    The maximum number of microsteps that the motor can take move at time,
#    to achieve the planned magnitude.
#axes_steps_diff: 4
#    The difference in motor positions in microsteps between two axes, used
#    to trigger a check for magnitude shift on the secondary axis in corexy
#    like kinematics. Default value: max_step_size + 1.
#retry_tolerance: 0
#    The forced threshold to which a pair of stepper motors on one belt
#    will have to lower the magnitude of the oscillations. It's recommended
#    to configure in order to filter possible inaccuracies. After several
#    iterations of starting synchronization, you will find the edge, to
#    which this parameter should be omitted.
#retries: 0
#    The maximum number of repetitions to achieve the forced threshold of
#    oscillations.

head_fan: heater_fan hotend_fan
#    Full name of the toolhead fan that will be turned off during sync to
#    eliminate its noise. Can be specified multiple fans by separating
#    their names with commas.
#axis_prefix_<axis>:
#    Allows you to set a custom prefix that will be displayed before the
#    axis name in terminal outputs. You can use special characters or
#    Unicode icons to make the axes easier to distinguish.

#####################################################################
##                   Model and Acceleration
#####################################################################
[printer]
kinematics: corexy                       # Printer type: corexy.
max_velocity: 2000                        # Maximum speed (max. 300 mm/s).
max_accel: 30000                          # Maximum acceleration (max. 5000 mm/s²).
max_z_velocity: 30                       # Z-axis maximum speed (15 mm/s).
max_z_accel: 350                         # Z-axis maximum acceleration (350 mm/s²).
square_corner_velocity: 15             # Square corner velocity (5.0 mm/s).

[input_shaper]
shaper_freq_x: 119 # center frequency for the X axis filter
shaper_type_x: mzv # filter type for the X axis
damping_ratio_x: 0.034 # damping ratio for the X axis
shaper_freq_y: 84.6 # center frequency for the Y axis filter
shaper_type_y: mzv # filter type for the Y axis
damping_ratio_y: 0.034 # damping ratio for the Y axis

[gcode_arcs]    # Enable arcs supportw
resolution: 0.1
    #   An arc will be split into segments. Each segment's length will
    #   equal the resolution in mm set above. Lower values will produce a
    #   finer arc, but also more work for your machine. Arcs smaller than
    #   the configured value will become straight lines. The default is
    #   1mm.s with an "mcu" prefix). Additional micro-controllers introduce additional pins that may be configured as heaters, steppers, fans, etc.. For example, if an "[mcu extra_mcu]" section is introduced, then pins such as "extra_mcu:ar9" may then be used elsewhere in the config (where "ar9" is a hardware pin name or alias name on the given mcu).

[exclude_object]  # Enable object exclusion

[save_variables]
filename: ~/variables.cfg
#   Required - provide a filename that would be used to save the
#   variables to disk e.g. ~/variables.cfg

#[force_move]
#enable_force_move: True

#[auto_speed]
#results_dir: ~/printer_data/config/auto_speed ; Destination directory for graphs

[display_status]
[pause_resume]

#####################################################################
##                      MCU Manta m8P
#####################################################################
[mcu]
canbus_uuid: cccdb0d58c74                # CAN bus unique identifier for MANTA M8P MCU.
#  The following command is used to view the ID of canbus and needs to be entered in the SSH terminal.
#  “~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0”

#####################################################################
##                      MCU EBBCan
#####################################################################
[mcu EBBCan] #Toolhead
canbus_uuid: 6a4c8547c5af
#bf29a8095f5f                # CAN bus unique identifier for EBBCan MCU.
  #07b7924e5e1a

[adxl345]
cs_pin: EBBCan: PB12                    # Chip select pin for ADXL345 accelerometer.
spi_software_sclk_pin: EBBCan: PB10     # Software SPI clock pin.
spi_software_mosi_pin: EBBCan: PB11     # Software SPI MOSI (Master Out Slave In) pin.
spi_software_miso_pin: EBBCan: PB2      # Software SPI MISO (Master In Slave Out) pin.                         # Map the axes to match the printer's coordinate system.
axes_map: x,z,-y
#axes_map: x,y,z



#####################################################################
##                      MCU bEACON
#####################################################################
[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_C39F716D5157383837202020FF05270E-if00
x_offset: 0 # update with offset from nozzle on your machine
y_offset: 23 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2

[resonance_tester]
accel_chip: beacon             # Specifies ADXL345 accelerometer for resonance testing
probe_points:
    150, 150, 20                # Coordinates of the probe points for resonance testing
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0
#####################################################################
# Temperature sensor
#####################################################################
[temperature_sensor chamber]
sensor_type: Generic 3950
#ATC Semitec 104NT-4-R025H42G                     # Sensor type for NTC thermistor (commented out).
sensor_pin: PB0                          # Pin connected to NTC thermistor (commented out).

[temperature_sensor M8P-MCU]             # MCU internal temperature sensor
sensor_type: temperature_mcu

[temperature_sensor RPI]                 # (PI)Host system internal temperature sensor.
sensor_type: temperature_host


#####################################################################
# 	                   Bed Grid Calibration
#####################################################################
[bed_mesh]
zero_reference_position: 150, 150    
#    set this to the middle of your bed
speed: 300
#    movement speed of toolhead during bed mesh
horizontal_move_z: 5
#    height of scanner during bed mesh scan
mesh_min: 60, 40
#    start point of bed mesh [X, Y]
mesh_max: 260,260
#    end point of bed mesh [X, Y]
probe_count: 30, 30
algorithm: bicubic

#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################
#[safe_z_home]
#home_xy_position: 150,150                # Example home_xy_position: 175,175 - This would be for a 350 * 350mm bed. 
#z_hop: 3                              # Z axis hop height after homin

[quad_gantry_level]
gantry_corners:                          # Coordinates for the gantry corners
    -60,-10
    360,370
points:                                  # Probe points
    50,25
    50,225
    250,225
    250,25
speed: 500                                 # Levelling speed in mm/min
horizontal_move_z: 5                       # Z-axis height for horizontal moves
retries: 20                                # Number of retries for out-of-tolerance adjustments
retry_tolerance: 0.0075                    # Tolerance for retrying
max_adjust: 10                             # Maximum adjustment stroke for leveling

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,
    
    # EXP2 headernano ~/printer_data/config/printer.cfg

    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>
    
#####################################################################
# 	Extruder
#####################################################################
    
[extruder]
step_pin: EBBCan: PD0              # Step pin
dir_pin: !EBBCan: PD1              # Direction pin, "!" indicates logic inversion
enable_pin: !EBBCan: PD2          # Enable pin, "!" indicates logic inversion
full_steps_per_rotation: 200         # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
microsteps: 16                       # Microsteps setting
## When calibrating the extruder, update the following value
## Assume you request 100mm feed but get 98mm,
## New value = old value x (actual extruded length / target length)
## 22.6789511 is our recommended value
#rotation_distance: 47.088
#22.67895 #for 5mm Shaft Driven Bondtech gearsets
gear_ratio: 50:8                    # Gear ratio
rotation_distance: 22.114244145        # Rotation distance
nozzle_diameter: 0.400               # Nozzle diameter
filament_diameter: 1.750             # Filament diameter
heater_pin: EBBCan: PB13             # Heater pin
#sensor_type: PT1000                  # Temperature sensor type
#sensor_pin: EBBCan: PA3              # Sensor pin
## Nozzle temperature PID calibration command: "PID_CALIBRATE HEATER=extruder TARGET=245"
control = pid                       # Control method
pid_Kp: 24.328                       # Proportional parameter of the PID controller
pid_Ki: 1.908                        # Integral parameter of the PID controller
pid_Kd: 77.543                       # Derivative parameter of the PID controller
min_temp: -20                        # Minimum temperature
max_temp: 4000                        # Maximum temperature
min_extrude_temp: 170                # Minimum extrude temperature
#pressure_advance: 0.02               # Pressure advance - try to keep pressure below 1.0
pressure_advance_smooth_time: 0.040   # Pressure advance smooth time - default is 0.040
pressure_advance_smooth_time: 0.040   ##	Default is 0.040, leave stock
max_extrude_cross_section: 5
max_extrude_only_distance: 150
#--------------------------------------------------------------------
sensor_type: MAX31865                # Temperature sensor type
sensor_pin: EBBCan: PA4            # Sensor pin
spi_bus: spi1
#spi_software_sclk_pin: EBBCan:gpio10 # SPI clock pin
#spi_software_mosi_pin: EBBCan:gpio8  # SPI master out slave in pin
#spi_software_miso_pin: EBBCan:gpio11 # SPI master in slave out pin
rtd_nominal_r: 100                   # RTD nominal resistance
rtd_reference_r: 430                 # RTD reference resistance
rtd_num_of_wires: 2                  # Number of wires for the RTD

[tmc2209 extruder]
uart_pin: EBBCan: PA15
run_current: 0.35
stealthchop_threshold: 999999
sense_resistor: 0.110

[verify_heater extruder]             # Heater block temperature tolerance configuration
max_error: 120                       # Maximum error
check_gain_time: 120                 # Tolerance time (default 20/60)
hysteresis: 50                       # Tolerance temperature (default 5)
heating_gain: 2                      # Heating gain

 #Firmware filament retraction. This enables G10 (retract) and G11 (unretract) GCODE commands issued by many slicers. The parameters below provide startup defaults, although the values can be adjusted via the SET_RETRACTION command), allowing per-filament settings and runtime tuning.
[firmware_retraction]
retract_length: 0.4             #   The length of filament (in mm) to retract when G10 is activated,
retract_speed: 40            #   The speed of retraction, in mm/s. The default is 20 mm/s.
unretract_extra_length: 0       #The length (in mm) of *additional* filament to add when unretracting.
unretract_speed: 40 #   The speed of unretraction, in mm/s. The default is 10 mm/s.

#####################################################################
##                  Heater_bed
#####################################################################
[heater_bed]
heater_pin: PA1                          #SSR Pin(HE1)
sensor_pin: PB1                          # sensor interface(TB)
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
#sensor_type:
sensor_type: Generic 3950
##  Adjust max_power so it doesn't exceed the SSR rating. The Omron G3NA-210B-DC5 SSR is rated at 4 amps without a heatsink.
##  The formula is "4 / (Wattage_of_bed_heater / Mains_voltage) = max_power"
##  If max_power is greater than 1.0, use 1.0
max_power: 1.0                           # Maximum power for the heater or fan
min_temp: 0                              # Minimum temperature threshold
max_temp: 130                            # Maximum temperature threshold
control = pid
pid_kp = 61.471
pid_ki = 1.805
pid_kd = 523.274

[idle_timeout]
timeout: 1800                            # Time in seconds (30 minutes) before turning off the hot bed if idle

#####################################################################
# 	LED Control
#####################################################################
#[neopixel sb_leds]                    # Stealthburner LED
#pin: EBBCan:PD3                     # Pin for hotend RGB LED control
#chain_count: 3                           # Number of LED beads in the chain
#color_order: GRBW                        # Color order for RGBW LEDs
#initial_RED: 0.2                         # Initial red brightness
#initial_GREEN: 0.2                       # Initial green brightness
#initial_BLUE: 0.2                        # Initial blue brightness
#initial_WHITE: 0.2

[output_pin caselight]
# Chamber Lighting - HE2 Connector (Optional)
pin: PA3
pwm:true
shutdown_value: 0
value: 1
cycle_time: 0.02227 # 44.9Hz



# stealthburner_led_effects_barf.cfg — Voronica LED Effects
# Configured for BARF HD high-density 25-LED logo PCB + GRBW nozzle neopixel + GRB sequin
#
# LED chain layout:
#   LEDs 1-25:  BARF HD logo PCB (GRB) — mounted upside down, data chain starts upper right
#   LED 26:     Nozzle neopixel pair wired in parallel (GRBW) — 4-value colors (R,G,B,W)
#   LED 27:     Sequin pair wired in parallel (GRB) — 3-value colors (R,G,B)
#
# CRITICAL: LEDs 26 and 27 have different color orders and must NEVER be addressed
#           together with a single color spec — this corrupts the data chain.
#
# Breathing effects use a static base layer at 0.20 floor on the dominant channel.
# Without the floor, GRB LEDs below ~0.15-0.20 brightness threshold appear off,
# causing only a handful of LEDs near the data-in pin to be visibly lit at the dim phase.
#
# Status summary:
#   status_ready        — Logo: rainbow gradient         | Nozzle: static white (W channel) | Sequin: static white RGB
#   status_busy         — Logo: breathing red            | Nozzle: breathing red             | Sequin: breathing red
#   status_heating      — Logo: orange comet on subset   | Nozzle: breathing orange          | Sequin: breathing orange
#   status_cooling      — Logo: blue comet on subset     | Nozzle: breathing blue            | Sequin: breathing blue
#   status_homing       — Logo: breathing teal/green     | Nozzle: breathing teal/green      | Sequin: breathing teal/green
#   status_leveling     — Logo: breathing purple         | Nozzle: breathing purple          | Sequin: breathing purple
#   status_meshing      — Logo: breathing green          | Nozzle: breathing green           | Sequin: breathing green
#   status_calibrating_z— Logo: breathing blue           | Nozzle: breathing blue            | Sequin: breathing blue
#   status_cleaning     — Logo: breathing blue/purple    | Nozzle: breathing blue/purple     | Sequin: breathing blue/purple
#   status_printing     — Logo: rainbow gradient         | Nozzle: static white RGB (no W)   | Sequin: static white RGB
#   status_part_ready   — Logo: breathing green/yellow   | Nozzle: breathing green/yellow    | Sequin: breathing green/yellow
#   status_off          — All LEDs off


[neopixel sb_leds]
pin: EBBCan:PD3
chain_count: 27
color_order: GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRBW, GRB
#   LEDs 1-25: BARF HD logo PCB (GRB)
#   LED 26:    Nozzle neopixel pair (GRBW)
#   LED 27:    Sequin pair (GRB)
initial_RED: 0.4
initial_GREEN: 0.4
initial_BLUE: 0.4
initial_WHITE: 0.0


##########################
# LED Effects Animations #
##########################

# Fires status_ready 2 seconds after Klipper finishes initialising
[delayed_gcode startup_leds]
initial_duration: 2
gcode:
    status_ready

##################
## logo effects ##
##################

# BUSY — solid red breathing, signals printer is occupied but not in a specific phase
[led_effect sb_logo_busy]
autostart:              false
frame_rate:             12
leds:
    neopixel:sb_leds (1-25)
layers:
    breathing  3 0 difference (0.8, 0.0, 0.0)
    static     0 0 bottom     (0.2, 0.0, 0.0)

# CLEANING — blue/purple breathing, signals nozzle wipe sequence
[led_effect sb_logo_cleaning]
autostart:              false
frame_rate:             12
leds:
    neopixel:sb_leds (1-25)
layers:
    breathing  3 0 difference (0.0, 0.02, 0.55)
    static     0 0 bottom     (0.0, 0.0,  0.20)

# CALIBRATING Z — blue breathing, signals Z contact calibration or beacon model build
[led_effect sb_logo_calibrating_z]
autostart:              false
frame_rate:             12
leds:
    neopixel:sb_leds (1-25)
layers:
    breathing  3 0 difference (0.0, 0.0, 0.55)
    static     0 0 bottom     (0.0, 0.0, 0.20)

# HEATING — orange comet chasing around a specific pixel subset on the logo PCB
# Pixel subset (1,2,7,8,17,18,20,21,23,24,4,5) kept as-is — working correctly
[led_effect sb_logo_heating]
leds:
    neopixel:sb_leds (1,2,7,8,17,18,20,21,23,24,4,5)
autostart:                          false
frame_rate:                         12
layers:
    comet  0.3  0 add (1, 0.18, 0)

# COOLING — blue comet chasing around the same pixel subset as heating
[led_effect sb_logo_cooling]
leds:
    neopixel:sb_leds (1,2,7,8,17,18,20,21,23,24,4,5)
autostart:                          false
frame_rate:                         12
layers:
    comet  0.3  0 add (0, 0, 1)

# HOMING — teal/green breathing, signals homing sequence in progress
[led_effect sb_logo_homing]
autostart:              false
frame_rate:             12
leds:
    neopixel:sb_leds (1-25)
layers:
    breathing  3 0 difference (0.0, 0.55, 0.15)
    static     0 0 bottom     (0.0, 0.20,  0.05)

# LEVELING — purple breathing, signals quad gantry leveling in progress
[led_effect sb_logo_leveling]
autostart:              false
frame_rate:             12
leds:
    neopixel:sb_leds (1-25)
layers:
    breathing  3 0 difference (0.55, 0.08, 0.30)
    static     0 0 bottom     (0.20, 0.02, 0.10)

# MESHING — green breathing, signals adaptive bed mesh scan in progress
[led_effect sb_logo_meshing]
autostart:              false
frame_rate:             12
leds:
    neopixel:sb_leds (1-25)
layers:
    breathing  3 0 difference (0.0, 0.8, 0.0)
    static     0 0 bottom     (0.0, 0.20, 0.0)

# PRINTING — warm orange/yellow gradient cycling across all 25 logo LEDs
# Nozzle stays at full white RGB (no W channel) during printing for illumination
[led_effect sb_logo_printing]
autostart:              false
frame_rate:             12
leds:
    neopixel:sb_leds (1-25)
layers:
    gradient  0.3  1 add (0.3, 0.0, 0.0),(0.3, 0.3, 0.0),(0.3, 0.1, 0.0)

# STANDBY — very dim white breathing, low-visibility idle state
[led_effect sb_logo_standby]
autostart:              false
frame_rate:             12
leds:
    neopixel:sb_leds (1-25)
layers:
    breathing  3 0 difference (0.15, 0.15, 0.15)
    static     0 0 bottom     (0.20, 0.20, 0.20)

# PART READY — green/yellow breathing, signals print complete and part ready to remove
[led_effect sb_logo_part_ready]
autostart:              false
frame_rate:             12
leds:
    neopixel:sb_leds (1-25)
layers:
    breathing  3 0 difference (0.0, 0.8, 0.0)
    static     0 0 bottom     (0.0, 0.20, 0.0)


#####################################################################
# 	Fan Control
#####################################################################
[fan] # Parts Cooling Fan 
pin: EBBCan: PA1                    # Fan pin 
max_power: 1.0                       # Maximum power for the fan
shutdown_speed: 0.0                  # Speed at which the fan shuts down
cycle_time: 0.00003                  # Cycle time
hardware_pwm: False                  # hardware pwm
kick_start_time: 0.100                     # Start-up time for the fan
#-------------------------------------------------------------
[heater_fan hotend_fan]               # Hotend cooling fan – 3-wire fan on 2-wire V-FAN slot, tach on empty TACH header
heater: extruder                      # Associated heating device
pin: EBBCan: PA0                      # Hotend fan pin
shutdown_speed: 0                     # Speed at which the fan shuts down
heater_temp: 50.0                     # Temperature to start the fan
fan_speed: 1.0                        # Fan speed
cycle_time: 0.00003                   # Cycle time
# — Tachometer setup ————————————————————————————————————————————————
tachometer_pin: ^EBBCan:PB9          # tach wire on empty header, “^” enables pull-up
tachometer_ppr: 2                      # 2 pulses per revolution (adjust if your fan differs)
tachometer_poll_interval: 0.0015       # sample every 0.5 ms to reliably catch pulses
#  [FAN0][FAN1][FAN2][FAN3]
#   PF7   PF9    PF6   PF8    
#  [FAN4][FAN5][FAN6]
#   PA5   PC2   PV1
#--------------------------------------------------------------------
##  Electronics fan - FAN0
    #Noctua NF-A6x25 - 12v
[heater_fan electronics_fan]              # Skirt fan 1
pin: PF7                                 # Pin for Skirt fan 1
kick_start_time: 0.5                     # Start-up time for the fan (do not change)
heater: heater_bed                       # Heater associated with this fan
heater_temp: 50                          # Temperature at which the fan activates
fan_speed: 1.0                           # Fan speed
max_power: 1.0                           # Maximum power for the fan
shutdown_speed: 0.0                      # Speed at which the fan shuts down (do not change)
#--------------------------------------------------------------------
## Electronics exhausa fan - FAN2
    #Noctua NF-A6x25 - 12v
[heater_fan exhaust_fan]             # Skirt fan 2
pin: PF6                                # Pin for Skirt fan 2
kick_start_time: 0.5                     # Start-up time for the fan (do not change)
heater: heater_bed
heater_temp: 50
fan_speed: 1.0                           # Fan speed
max_power: 1.0
shutdown_speed: 0.0                      # Speed at which the fan shuts down (do not change)
#--------------------------------------------------------------------
##  Manta RAys - FAN3
    #Noctua NF-A4x10 - 12v
[controller_fan driver_fan]
pin: PF8
# Choose any of the stepper sections involved in motion
# (X, Y, Z, or extruder — or all of them)
stepper: stepper_x, stepper_y, stepper_z
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5
fan_speed: 1.0
idle_timeout: 60                      #The amount of time (in seconds) after a stepper driver or heater was active and the fan should be kept running. The default is 30 seconds.
                                      #60 seconds after idle condition is reached the fan is turned off
#idle_speed: 40                        #When idle condition is reached, then set the fan speed to 40%

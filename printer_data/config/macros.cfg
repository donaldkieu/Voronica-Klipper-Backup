
#####################################################################
#   Print_start macro for v2
#####################################################################
[gcode_macro PRINT_START]
# Source https://github.com/jontek2/A-better-print_start-macro
# Unified startup sequence for high-speed printing — includes slicer temp logic, QGL, chamber soak, mesh leveling, and purge

gcode:
    {% set target_bed       = params.BED|int %}                                   ; Bed temperature target from slicer
    {% set target_extruder  = params.EXTRUDER|int %}                              ; Extruder temperature target from slicer
    {% set target_chamber   = params.CHAMBER|default("45")|int %}                 ; Chamber temperature target or default
    {% set x_wait           = printer.toolhead.axis_maximum.x|float / 2 %}        ; Halfway X axis limit for wait calculations
    {% set y_wait           = printer.toolhead.axis_maximum.y|float / 2 %}        ; Halfway Y axis limit for wait calculations
    {% set FILAMENT_PROFILE = params.FILAMENT_PROFILE|default('none')|string %}   ; Filament profile from slicer or default none
    {% set BED_TYPE         = params.BED_TYPE|default('unknown')|string %}        ; Bed type profile from slicer or default unknown
    {% set bed_start_wait   = (target_bed * 0.9)|round(0, 'floor') %}             ; 90% of target bed temp
    {% set OFFSET = params.OFFSET|default(0)|float %}
    # ─── Filament and Bed Profile Logging ─────────────────────
    RESPOND MSG="Filament Type: {FILAMENT_PROFILE}"                              ; Log filament profile to console

    # Uncomment this block to add per-material announcements
    # {% if FILAMENT_PROFILE == 'PLA' %}
    #     {action_respond_info("PLA")}
    # {% elif FILAMENT_PROFILE == 'PETG' %}
    #     {action_respond_info("PETG")}
    # {% elif FILAMENT_PROFILE == 'ASA' %}
    #     {action_respond_info("ASA")}
    # {% elif FILAMENT_PROFILE == 'ABS' %}
    #     {action_respond_info("ABS")}
    # {% elif FILAMENT_PROFILE == 'TPU' %}
    #     {action_respond_info("TPU")}
    # {% endif %}

    RESPOND MSG="Bed Type: {BED_TYPE}"                                           ; Log bed type profile to console

    # Use the BED_TYPE value for additional actions
    # {% if BED_TYPE == 'High Temp Plate' %}
    #     {action_respond_info("High Temp Plate Z-Offset selected")}
    # {% elif BED_TYPE == 'Textured PEI Plate' %}
    #     {action_respond_info("Textured PEI Plate Z-Offset selected")}
    # {% else %}
    #     {action_respond_info("Unknown bed type")}
    # {% endif %}

    # {action_emergency_stop("Impending Doom Averted!")}
    RESPOND MSG="Filament Offset: {OFFSET}"                                           ; Log filament offset to console
    #LIGHT_100
    # ─── Z offset and homing ─────────────────────────────────
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0                                                          ; Reset Z offset
    SET_DISPLAY_TEXT MSG="Initial Homing"                                         ; Display info on screen
    STATUS_HOMING                                                                 ; Set LEDs to homing mode
    G28                                                                           ; Home all axes
    G90                                                                           ; Absolute positioning
    G0 Z2   ; position beacon at 2mm for heat soak
    # ─── Bed heat background + 80% wait ─────────────────────
    SET_DISPLAY_TEXT MSG="Bed heating to {target_bed}°C (waiting to {bed_start_wait}°C)" ; Display bed heat message
    M140 S{target_bed}                                                            ; Start bed heating in background
    M104 S175                                                                     ; start preheating nozzle to probing temp
    #G1 X150 Y150 F9000                                                            ; Move to bed center
    SYNC_MOTORS
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_start_wait}                   ; Wait until bed ≥ 80% target

    # ─── Chamber soak if high-temp material ─────────────────
    {% if target_bed > 85 %}
        SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber}°C"                       ; Display chamber heat soak target
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber} ; Wait for chamber temp
    {% endif %}

    # ─── Hotend preheat for Z homing ────────────────────────
    SET_DISPLAY_TEXT MSG="Hotend: 175°C"                                          ; Display hotend preheat
    M109 S175                                                                    ; Heat hotend to 150°C and wait

 # ─── Nozzle wipe sequence ─────────────────────────────
    SET_DISPLAY_TEXT MSG="Wiping"                                                 ; Display wipe message
    STATUS_CLEANING
    G90                                                                           ; Absolute positioning
    G1 Z10 F1200                                                                  ; Lift nozzle off bed
    G1 X96 Y299 F15000                                                            ; Move near wiper
    G1 Z2 F1200                                                                   ; Lower nozzle onto wiper
    WIPE
    WIPE
    G90                                                                           ; Return to absolute mode
    G1 Z10 F1500                                                                  ; Lift nozzle again

    # ─── Quad gantry leveling and Z Calibration ─────────────────
    SET_DISPLAY_TEXT MSG="Leveling"                                               ; Display leveling message
    STATUS_LEVELING                                                               ; Set LEDs to leveling mode
    QUAD_GANTRY_LEVEL                                                             ; Perform quad gantry level
    STATUS_CALIBRATING_Z
    G28 Z METHOD=CONTACT CALIBRATE=1    										;will use contact to find zero offset, and then calibrate a beacon model for scan mode. Setting CALIBRATE=0 can skip beacon model creation to save time. 

    # ─── Bed mesh calibration ─────────────────────────────
    SET_DISPLAY_TEXT MSG="Bed mesh"                                              ; Display bed mesh message
    STATUS_MESHING                                                               ; Set LEDs to mesh modeBED_MESH_CALIBRATE RUNS=1 ADAPTIVE=1          ; bed mesh in scan mode
    BED_MESH_CALIBRATE RUNS=1 ADAPTIVE=1                                                   ; bed mesh in scan mode

    # ─── Nozzle wipe sequence ─────────────────────────────
    SET_DISPLAY_TEXT MSG="Wiping"                                                 ; Display wipe message
    STATUS_CLEANING
    G90                                                                           ; Absolute positioning
    G1 Z10 F1200                                                                  ; Lift nozzle off bed
    G1 X96 Y299 F15000                                                            ; Move near wiper
    G1 Z2 F1200                                                                   ; Lower nozzle onto wiper
    WIPE
    WIPE
    G90                                                                           ; Return to absolute mode
    G1 Z10 F1500  

    # ─── Final Z Calibration ─────────────────
    SET_DISPLAY_TEXT MSG="Z Calibration" 
    G28 Z METHOD=CONTACT CALIBRATE=0    ; calibrate z offset only after tilt/mesh
# ─── Final heat and line purge ─────────────────────────
    SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}°C"                           ; Display hotend target
    STATUS_HEATING                                                               ; Set LEDs to heating mode
    M107                                                                         ; Turn off part cooling fan
    M109 S{target_extruder}                                                      ; Heat hotend to target
    SET_GCODE_OFFSET Z=0.07     ; add a little offset for hotend thermal expansion
                            ; needs fine tuning, long meltzones require more
    SET_GCODE_OFFSET Z_ADJUST={OFFSET}  ; apply optional material squish via slicer
    RESPOND MSG="Filament Offset: {OFFSET}"                                           ; Log filament offset to console
    SET_DISPLAY_TEXT MSG="Printer goes brr"                                      ; Display printing message
    STATUS_PRINTING                                                              ; Set LEDs to printing mode
    #LINE_PURGE                                                                   ; Run purge routine
    #SQUIGGLY_PURGE
    WIGGLY_PURGE SIZE={params.SIZE|default("0_0_0_0")}
    #SKEW_PROFILE LOAD=Califlower

#####################################################################
#   Print_End macro for v2
#####################################################################
[gcode_macro PRINT_END]
# Unified print shutdown routine — combines chamber cooldown, safe retraction,
# user prompt for bed, and toolhead parking with motion state preservation.
gcode:

    # ─── Calculate Safe Positions ──────────────────────────────
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
     # ─── Raise Z and Save State ───────────────────────────────
    G91
    G1 Z50 F1500                                                     ; Raise Z safely before saving state
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    # ─── Bed Cooldown Trigger ────────────────────────────────
    #UPDATE_DELAYED_GCODE ID=bedfan_cooldown DURATION=5            ; Start bedfan cooldown loop

    # ─── Extruder Shutdown ────────────────────────────────────
    M400                                                          ; Wait for buffer to clear
    G92 E0                                                        ; Zero extruder position
    G1 E-15.0 F3600                                               ; Retract filament
     # ─── String Cleanup Move ─────────────────────────────────
    G91                                                           ; Relative positioning
    G0 X40.0 Y40.0 F20000                                         ; Small move to reduce stringing
    G90                                                           ; Absolute positioning
    # ─── Turn Off Heaters and Fans ──────────────────────────
    M104 S0                                                       ; Turn off hotend heater
    M107                                                         ; Turn off part cooling fan
    TURN_OFF_HEATERS
   # ─── Clear Mesh and Restore State ───────────────────────
    BED_MESH_CLEAR                                               ; Clear bed mesh data
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0             ; Restore motion state without moving
    #LIGHT_OFF
    #SET_SKEW CLEAR=1


[gcode_macro SET_FILAMENT_OFFSET]
variable_offset: 0.0
gcode:
    {% set OFFSET = params.OFFSET|default(0)|float %}
    SET_GCODE_VARIABLE MACRO=SET_FILAMENT_OFFSET VARIABLE=offset VALUE={OFFSET}
    RESPOND MSG="offset is: {printer['gcode_macro SET_FILAMENT_OFFSET'].offset}"

##################################################
#                 -- QUAD_GANTRY_LEVEL --                  
##################################################
[gcode_macro QUAD_GANTRY_LEVEL]             # Replace default QGL with conditional coarse→fine
rename_existing: _QUAD_GANTRY_LEVEL         # Preserve original
gcode:
  {% set was_applied = printer.quad_gantry_level.applied|default(False) %}
  # True if a successful QGL has been applied since last restart

  {% set homed = printer.toolhead.homed_axes|default("")|lower %}
  {% if not ('x' in homed and 'y' in homed) %}
    G28                                      # Ensure safe gantry moves
  {% endif %}

  {% if not was_applied %}
    # Cold session → run COARSE once, then immediately run FINE
    _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=10.0 RETRY_TOLERANCE=1.0 PROBE_SPEED=15 LIFT_SPEED=15
    _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=3.0  RETRY_TOLERANCE=0.0075
  {% else %}
    # Warm session → run FINE only
    _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=3.0  RETRY_TOLERANCE=0.0075
  {% endif %}

##################################################
#                 -- SQUIGGLY PURGE --                  #
##################################################
[gcode_macro SQUIGGLY_PURGE]
gcode:
    # Mathematical constants
    {% set TAU = 6.28318 %}
    {% set PI = 3.14159 %}
    {% set FACTORIALS = [1, 2, 24, 720, 40320, 3628800, 479001600, 87178291200, 20922789888000] %}
    
    # Base macro parameters
    {% set prime_line_steps = params.STEPS|default(16)|int %}
    {% set prime_line_periods = params.PERIODS|default(10)|int %}
    {% set prime_line_amplitude = params.AMPLITUDE|default(5.0)|float %}
    {% set prime_line_period_length = params.PERIOD_LENGTH|default(5.0)|float %}
    {% set prime_line_purge_distance = params.PURGE_LENGTH|default(100.0)|float %}
    {% set prime_line_flowrate = params.FLOWRATE|default(10.0)|float %}
    {% set prime_line_height = params.LINE_HEIGHT|default(0.6)|float %}
    {% set prime_line_unretract_length = params.UNRETRACT_LENGTH|default(5.0)|float %}
    {% set prime_line_direction = params.LINE_DIRECTION |default("X")|string|upper %}
    {% set prime_line_margin = params.LINE_MARGIN|default(10.0)|float %} # Used only in adaptive mode
    {% set prime_line_adaptive = params.ADAPTIVE_MODE|default(1)|int %}
    {% set verbose = params.VERBOSE|default(1)|int %}

    # If the SIZE parameter is defined and not a dummy placeholder, we use it to do the adaptive bed mesh logic
    {% set coordinates_found = False %}
    {% if params.SIZE is defined and params.SIZE != "0_0_0_0" %}
        {% set xMinSpec, yMinSpec, xMaxSpec, yMaxSpec = params.SIZE.split('_')|map('trim')|map('int') %}
        {% set coordinates_found = True %}
    {% elif printer.exclude_object is defined %}
        {% if printer.exclude_object.objects %}
            # Else if SIZE is not defined, we fallback to use the [exclude_object] tags
            # This method is derived from Kyleisah KAMP repository: https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging)
            {% set eo_points = printer.exclude_object.objects|map(attribute='polygon')|sum(start=[]) %}
            {% set xMinSpec = eo_points|map(attribute=0)|min %}
            {% set yMinSpec = eo_points|map(attribute=1)|min %}
            {% set xMaxSpec = eo_points|map(attribute=0)|max %}
            {% set yMaxSpec = eo_points|map(attribute=1)|max %}
            {% set coordinates_found = True %}
        {% endif %}
    {% endif %}

    # We get the default prime line position parameters
    {% set prime_line_x = params.START_X|default(16.0)|float %}
    {% set prime_line_y = params.START_Y|default(31.0)|float %}
    {% set center_x, center_y = [printer.toolhead.axis_maximum.x / 2, printer.toolhead.axis_maximum.y / 2]|map("float") %}

    # Account for the amplitude (height) of the purge line
    {% if prime_line_direction == "X" %}
        {% set offset_x, offset_y = 0, prime_line_amplitude/2 %}
    {% else %}
        {% set offset_x, offset_y = prime_line_amplitude/2, 0 %}
    {% endif %}

    # If first layer coordinates are retrieved and adaptive mode is enabled, then we replace the coordinates to
    # do an adaptive purge while being careful to have the line stay on the bed when the first layer
    # is in an opposite bed quadrant than the prime line initial coordinates (due to mirrored coordinates from center axes)...
    {% if coordinates_found and prime_line_adaptive == 1 %}
        {% set prime_line_x = 2*center_x - prime_line_x if (prime_line_x > center_x and xMaxSpec < center_x) or (prime_line_x < center_x and xMinSpec > center_x) 
                               else prime_line_x %}
        {% set prime_line_y = 2*center_y - prime_line_y if (prime_line_y > center_y and yMaxSpec < center_y) or (prime_line_y < center_y and yMinSpec > center_y) 
                               else prime_line_y %}
        {% set prime_line_x = [[prime_line_x, xMinSpec - prime_line_margin - offset_x]|max, xMaxSpec + prime_line_margin + offset_x]|min %}
        {% set prime_line_y = [[prime_line_y, yMinSpec - prime_line_margin - offset_y]|max, yMaxSpec + prime_line_margin + offset_y]|min %}
    {% endif %}

    # Hard floor clamps — only block motor corner zones, not the full front row
    # Left motor:  X 0–15,  Y 0–30
    # Right motor: X 285–300, Y 0–30
    {% if prime_line_x < 16.0 and prime_line_y < 31.0 %}
        {% set prime_line_x = 16.0 %}
    {% endif %}
    {% if prime_line_x > 284.0 and prime_line_y < 31.0 %}
        {% set prime_line_x = 284.0 %}
    {% endif %}

    # Choose the way of printing the primeline (in + or -) alongside the direction to avoid going outside the bed boundaries
    {% set prime_line_way = -1 if (prime_line_direction == "X" and prime_line_x > center_x) or (prime_line_direction == "Y" and prime_line_y > center_y) else 1 %}

    # Calculate steps
    {% set steps = [] %}
    {% set state = namespace(cur_y=prime_line_y, prime_line_length=0.0, cos=0.0) %}

    {% for step in range(1, prime_line_periods * prime_line_steps + 1) %}
        {% set sign = cycler(1.0, -1.0) %}
        {% set state.cos = 0.0 %}
        {% set rad_angle = step / prime_line_steps * TAU %}
        {% for i in range(0, FACTORIALS|length) %}
            {% set cos_step = sign.next() * ((rad_angle%TAU)**(2*i) / FACTORIALS[i]) %}
            {% set state.cos = state.cos + cos_step %}
        {% endfor %}
        {% set dist_x = step * prime_line_period_length / prime_line_steps %}
        {% set dist_y = prime_line_amplitude * (0.5 - (0.5 * state.cos)) %}
        {% set rel_x = prime_line_period_length/prime_line_steps %}
        {% set rel_y = prime_line_y + dist_y - state.cur_y %}
        {% set e_length = (rel_x**2 + rel_y**2)**0.5 %}
        {% set state.cur_y = state.cur_y + rel_y %}
        {% set state.prime_line_length = state.prime_line_length + e_length %}
        {% set _ = steps.append((rel_x, rel_y, e_length)) %}
    {% endfor %}
    
    {% set max_extrude_cross_section = printer["configfile"].config["extruder"]["max_extrude_cross_section"]|float %}
    {% set filament_diameter = printer["configfile"].config["extruder"]["filament_diameter"]|float %}
    {% set filament_area = PI * (filament_diameter / 2)**2 %}
    
    # We first compute the width of the prime line
    {% set purge_volume = prime_line_purge_distance * filament_area %}
    {% set line_width = purge_volume / (prime_line_height * state.prime_line_length) %}

    # Then we check that the prime line cross section will not be problematic (exceeding Klipper max_extrude_cross_section)
    # or, if it's the case, we warn the user and add a correction to the length of filament to be purged
    {% if (prime_line_height * line_width) > max_extrude_cross_section %}
        {% if verbose %}
            {action_respond_info("The prime_line_purge_distance of %.4f mm is too high and will exceed the max_extrude_cross_section!" % prime_line_purge_distance)}
        {% endif %}
        {% set prime_line_purge_distance = 0.98 * (max_extrude_cross_section * state.prime_line_length) / filament_area %}
        {% set purge_volume = prime_line_purge_distance * filament_area %}
        {% set line_width = purge_volume / (prime_line_height * state.prime_line_length) %}
        {% if verbose %}
            {action_respond_info("Corrected the prime_line_purge_distance to %.4f mm" % prime_line_purge_distance)}
        {% endif %}
    {% endif %}

    # We then compute the height to width ratio and validate that the prime line will not be too thin
    {% if (prime_line_height / line_width) >= 0.5 %} # TODO: validate this 1/2 ratio is good for all
        {action_raise_error("The prime line will be too thin %.4f x %.4f and will probably not stick properly to the bed. Increase its purge distance or decrease its length!" % (prime_line_height, line_width))}
    {% endif %}

    # Finally we compute the speed to get the correct flowrate for the prime line
    {% set speed = (prime_line_flowrate / (prime_line_height * line_width)) * 60 |float %}

    G91
    M83
    {% if (printer.toolhead.position.z < 5) %}
        G1 Z5 F600
    {% endif %}

    # Starting position
    G90
    G0 X{prime_line_x} Y{prime_line_y} F18000

    # Add some extra squish to the prime line 
    G1 Z{prime_line_height*0.8} F600

    # Add pressure in the nozzle
    G92 E0
    G1 E{prime_line_unretract_length} F300

    # Prime line
    G92 E0
    G91
    {% if prime_line_direction == "X" %}
        {% for x,y,e in steps %}
            G1 X{x*prime_line_way} Y{y} E{e/state.prime_line_length*prime_line_purge_distance} F{speed}
        {% endfor %}
    {% elif prime_line_direction == "Y" %}
        {% for y,x,e in steps %}
            G1 X{x} Y{y*prime_line_way} E{e/state.prime_line_length*prime_line_purge_distance} F{speed}
        {% endfor %}
    {% else %}
        { action_respond_error("Prime line direction is not valid. Choose either X or Y in the variables.cfg file!") }
    {% endif %}
    G90
    
    # Retract and Z-hop
    G92 E0
    G1 E-0.2 F2100
    G92 E0
    G1 Z3 F600

    # Additional small movement to get out of the line as some slicers directly emmit
    # a Z- move as a first step that make the toolhead crash back in the line and get dirty
    G91
    G1 X5 Y5 F18000
    G90
    
    # Flushing Klipper's buffer to ensure the primeline sequence is done before continuing
    M400


##################################################
#               -- WIGGLY PURGE --             #
##################################################
# Changes from original:
# - Auto-selects purge direction based on print position (front → left side → right side)
# - Motor corner exclusion zones enforced (left: X<15 Y<30, right: X>285 Y<30)
# - START_X/START_Y defaults updated to safe positions
# - SIZE parameter passed through from PRINT_START for accurate object bounds
##################################################
[gcode_macro WIGGLY_PURGE]
gcode:
    # Mathematical constants
    {% set TAU = 6.28318 %}
    {% set PI = 3.14159 %}
    {% set FACTORIALS = [1, 2, 24, 720, 40320, 3628800, 479001600, 87178291200, 20922789888000] %}

    # Base macro parameters
    {% set prime_line_steps = params.STEPS|default(16)|int %}
    {% set prime_line_periods = params.PERIODS|default(10)|int %}
    {% set prime_line_amplitude = params.AMPLITUDE|default(5.0)|float %}
    {% set prime_line_period_length = params.PERIOD_LENGTH|default(5.0)|float %}
    {% set prime_line_purge_distance = params.PURGE_LENGTH|default(100.0)|float %}
    {% set prime_line_flowrate = params.FLOWRATE|default(10.0)|float %}
    {% set prime_line_height = params.LINE_HEIGHT|default(0.6)|float %}
    {% set prime_line_unretract_length = params.UNRETRACT_LENGTH|default(5.0)|float %}
    {% set prime_line_margin = params.LINE_MARGIN|default(10.0)|float %}
    {% set prime_line_adaptive = params.ADAPTIVE_MODE|default(1)|int %}
    {% set verbose = params.VERBOSE|default(1)|int %}

    # Motor exclusion zone constants for Voronica
    # Left motor:  X 0–15,  Y 0–30
    # Right motor: X 285–300, Y 0–30
    {% set motor_x_left = 15.0 %}
    {% set motor_x_right = 285.0 %}
    {% set motor_y_front = 30.0 %}

    # Minimum clearance needed below/beside print for a front/side purge
    # front: motor_y_front + margin + amplitude/2 + buffer = 30 + 10 + 2.5 + 2.5 = 45
    # side:  motor_x_left + margin + amplitude/2 + buffer = 15 + 10 + 2.5 + 2.5 = 30
    {% set front_purge_min_y = motor_y_front + prime_line_margin + prime_line_amplitude / 2 + 2.5 %}
    {% set side_purge_min_x_left = motor_x_left + prime_line_margin + prime_line_amplitude / 2 + 2.5 %}
    {% set side_purge_min_x_right = motor_x_right - prime_line_margin - prime_line_amplitude / 2 - 2.5 %}

    # Get object bounds
    {% set coordinates_found = False %}
    {% if params.SIZE is defined and params.SIZE != "0_0_0_0" %}
        {% set xMinSpec, yMinSpec, xMaxSpec, yMaxSpec = params.SIZE.split('_')|map('trim')|map('float') %}
        {% set coordinates_found = True %}
    {% elif printer.exclude_object is defined %}
        {% if printer.exclude_object.objects %}
            {% set eo_points = printer.exclude_object.objects|map(attribute='polygon')|sum(start=[]) %}
            {% set xMinSpec = eo_points|map(attribute=0)|min %}
            {% set yMinSpec = eo_points|map(attribute=1)|min %}
            {% set xMaxSpec = eo_points|map(attribute=0)|max %}
            {% set yMaxSpec = eo_points|map(attribute=1)|max %}
            {% set coordinates_found = True %}
        {% endif %}
    {% endif %}

    # ─── Auto direction selection ──────────────────────────────────────────────
    # Default safe positions (no object data): purge along front, clear of motors
    {% set prime_line_direction = "X" %}
    {% set prime_line_x = 16.0 %}
    {% set prime_line_y = motor_y_front + 2.0 %}

    {% if coordinates_found and prime_line_adaptive == 1 %}
        # Try front purge first — place line below yMinSpec
        {% set candidate_y = yMinSpec - prime_line_margin - prime_line_amplitude / 2 %}
        {% if candidate_y >= front_purge_min_y %}
            # Front purge fits — place below the print, direction X
            {% set prime_line_direction = "X" %}
            {% set prime_line_x = xMinSpec %}
            {% set prime_line_y = candidate_y %}
            # Clamp X away from motor corners if purge is in motor Y zone
            {% if prime_line_y < motor_y_front %}
                {% set prime_line_x = [prime_line_x, motor_x_left + 1.0]|max %}
                {% set prime_line_x = [prime_line_x, motor_x_right - 1.0]|min %}
            {% endif %}
            {% if verbose %}
                {action_respond_info("SQUIGGLY_PURGE: Front purge selected at X=%.1f Y=%.1f" % (prime_line_x, prime_line_y))}
            {% endif %}
        {% elif xMinSpec >= side_purge_min_x_left %}
            # Left side purge — place line left of xMinSpec, direction Y
            {% set prime_line_direction = "Y" %}
            {% set prime_line_x = xMinSpec - prime_line_margin - prime_line_amplitude / 2 %}
            {% set prime_line_y = yMinSpec %}
            # Clamp X away from left motor exclusion
            {% set prime_line_x = [prime_line_x, motor_x_left + 1.0]|max %}
            {% if verbose %}
                {action_respond_info("SQUIGGLY_PURGE: Left side purge selected at X=%.1f Y=%.1f" % (prime_line_x, prime_line_y))}
            {% endif %}
        {% elif xMaxSpec <= side_purge_min_x_right %}
            # Right side purge — place line right of xMaxSpec, direction Y
            {% set prime_line_direction = "Y" %}
            {% set prime_line_x = xMaxSpec + prime_line_margin + prime_line_amplitude / 2 %}
            {% set prime_line_y = yMinSpec %}
            # Clamp X away from right motor exclusion
            {% set prime_line_x = [prime_line_x, motor_x_right - 1.0]|min %}
            {% if verbose %}
                {action_respond_info("SQUIGGLY_PURGE: Right side purge selected at X=%.1f Y=%.1f" % (prime_line_x, prime_line_y))}
            {% endif %}
        {% else %}
            # No safe position found — fallback to bed center front, warn user
            {% set prime_line_direction = "X" %}
            {% set prime_line_x = 50.0 %}
            {% set prime_line_y = motor_y_front + 2.0 %}
            {action_respond_info("SQUIGGLY_PURGE WARNING: No safe purge position found. Print may be too large or too close to bed edges. Falling back to front center.")}
        {% endif %}
    {% endif %}

    # ─── offset_x/offset_y for amplitude accounting ────────────────────────────
    {% if prime_line_direction == "X" %}
        {% set offset_x = 0 %}
        {% set offset_y = prime_line_amplitude / 2 %}
    {% else %}
        {% set offset_x = prime_line_amplitude / 2 %}
        {% set offset_y = 0 %}
    {% endif %}

    # Choose purge direction (+ or -) to avoid going outside bed boundaries
    {% set center_x = printer.toolhead.axis_maximum.x / 2 |float %}
    {% set center_y = printer.toolhead.axis_maximum.y / 2 |float %}
    {% set prime_line_way = -1 if (prime_line_direction == "X" and prime_line_x > center_x) or (prime_line_direction == "Y" and prime_line_y > center_y) else 1 %}

    # ─── Calculate steps ───────────────────────────────────────────────────────
    {% set steps = [] %}
    {% set state = namespace(cur_y=prime_line_y, prime_line_length=0.0, cos=0.0) %}

    {% for step in range(1, prime_line_periods * prime_line_steps + 1) %}
        {% set sign = cycler(1.0, -1.0) %}
        {% set state.cos = 0.0 %}
        {% set rad_angle = step / prime_line_steps * TAU %}
        {% for i in range(0, FACTORIALS|length) %}
            {% set cos_step = sign.next() * ((rad_angle%TAU)**(2*i) / FACTORIALS[i]) %}
            {% set state.cos = state.cos + cos_step %}
        {% endfor %}
        {% set dist_x = step * prime_line_period_length / prime_line_steps %}
        {% set dist_y = prime_line_amplitude * (0.5 - (0.5 * state.cos)) %}
        {% set rel_x = prime_line_period_length / prime_line_steps %}
        {% set rel_y = prime_line_y + dist_y - state.cur_y %}
        {% set e_length = (rel_x**2 + rel_y**2)**0.5 %}
        {% set state.cur_y = state.cur_y + rel_y %}
        {% set state.prime_line_length = state.prime_line_length + e_length %}
        {% set _ = steps.append((rel_x, rel_y, e_length)) %}
    {% endfor %}

    {% set max_extrude_cross_section = printer["configfile"].config["extruder"]["max_extrude_cross_section"]|float %}
    {% set filament_diameter = printer["configfile"].config["extruder"]["filament_diameter"]|float %}
    {% set filament_area = PI * (filament_diameter / 2)**2 %}

    # Compute line width from purge volume
    {% set purge_volume = prime_line_purge_distance * filament_area %}
    {% set line_width = purge_volume / (prime_line_height * state.prime_line_length) %}

    # Check and correct cross section if needed
    {% if (prime_line_height * line_width) > max_extrude_cross_section %}
        {% if verbose %}
            {action_respond_info("The prime_line_purge_distance of %.4f mm is too high and will exceed the max_extrude_cross_section!" % prime_line_purge_distance)}
        {% endif %}
        {% set prime_line_purge_distance = 0.98 * (max_extrude_cross_section * state.prime_line_length) / filament_area %}
        {% set purge_volume = prime_line_purge_distance * filament_area %}
        {% set line_width = purge_volume / (prime_line_height * state.prime_line_length) %}
        {% if verbose %}
            {action_respond_info("Corrected the prime_line_purge_distance to %.4f mm" % prime_line_purge_distance)}
        {% endif %}
    {% endif %}

    # Validate line will not be too thin
    {% if (prime_line_height / line_width) >= 0.5 %}
        {action_raise_error("The prime line will be too thin %.4f x %.4f and will probably not stick properly to the bed. Increase its purge distance or decrease its length!" % (prime_line_height, line_width))}
    {% endif %}

    # Compute speed for target flowrate
    {% set speed = (prime_line_flowrate / (prime_line_height * line_width)) * 60 |float %}

    G91
    M83
    {% if (printer.toolhead.position.z < 5) %}
        G1 Z5 F600
    {% endif %}

    # Starting position
    G90
    G0 X{prime_line_x} Y{prime_line_y} F18000

    # Add some extra squish to the prime line
    G1 Z{prime_line_height*0.8} F600

    # Add pressure in the nozzle
    G92 E0
    G1 E{prime_line_unretract_length} F300

    # Prime line
    G92 E0
    G91
    {% if prime_line_direction == "X" %}
        {% for x,y,e in steps %}
            G1 X{x*prime_line_way} Y{y} E{e/state.prime_line_length*prime_line_purge_distance} F{speed}
        {% endfor %}
    {% elif prime_line_direction == "Y" %}
        {% for y,x,e in steps %}
            G1 X{x} Y{y*prime_line_way} E{e/state.prime_line_length*prime_line_purge_distance} F{speed}
        {% endfor %}
    {% else %}
        { action_respond_error("Prime line direction is not valid.") }
    {% endif %}
    G90

    # Retract and Z-hop
    G92 E0
    G1 E-0.2 F2100
    G92 E0
    G1 Z3 F600

    # Small move to clear purge line before slicer Z move
    G91
    G1 X5 Y5 F18000
    G90

    # Flush buffer
    M400


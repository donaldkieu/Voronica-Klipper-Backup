##################################################
#                 -- Homing --                  
##################################################
[homing_override]
axes: xyz
gcode:
    # ------------------------------------------------------------
    # Determine which axes the user requested to home.
    # Klipper passes macros parameters based on letters provided.
    # Example:
    #   G28 X   → do_x = True, others False
    #   G28 Z   → do_z = True, others False
    #   G28     → no params → home_all = True
    # ------------------------------------------------------------
    {% set do_x = 'X' in params %}
    {% set do_y = 'Y' in params %}
    {% set do_z = 'Z' in params %}

    # True when user typed simply "G28" (no axes specified)
    {% set home_all = (not do_x and not do_y and not do_z) %}

    G90  # Ensure absolute positioning before any homing moves


    ######################################################################
    # 1) HOME ALL (G28)
    #
    # This section runs ONLY when the user sends G28 with no letters.
    # Inside a homing_override, Klipper does NOT update "homed_axes"
    # until AFTER the macro finishes. Therefore, we must NOT check
    # homed_axes inside this block.
    #
    # We manually enforce your desired sequence:
    #     1) Home Y first
    #     2) Home X second
    #     3) Move to the center
    #     4) Home Z last (safe because XY are now known)
    ######################################################################
    {% if home_all %}
        G28 Y                      ; Home Y axis first
        G28 X                      ; Then home X axis
        G1 X150 Y150 F9000         ; Move to center before Z-homing
        G28 Z                      ; Home Z (safe because XY were just homed)
        G1 Z10                     ; Lift nozzle after Z homing
    {% endif %}


    ######################################################################
    # 2) HOME X ONLY (G28 X)
    #
    # X homing MUST require Y to be homed first.
    # Your intention: prevent unintended gantry twist.
    #
    # Because homed_axes *is* valid when G28 X is called alone,
    # we can check its contents safely.
    ######################################################################
    {% if do_x and not home_all %}
        {% if 'y' in printer.toolhead.homed_axes %}
            G28 X                  ; Safe to home X because Y is known
        {% else %}
            {action_raise_error("Cannot home X — Y not homed.")}
        {% endif %}
    {% endif %}


    ######################################################################
    # 3) HOME Y ONLY (G28 Y)
    #
    # Y is always allowed to home independently.
    #
    # This does NOT depend on X or Z being homed.
    ######################################################################
    {% if do_y and not home_all %}
        G28 Y
    {% endif %}


    ######################################################################
    # 4) HOME Z ONLY (G28 Z)
    #
    # Z homing *must* require XY to already be homed.
    # This is Klipper's safety model:
    #
    #   "Klipper must know the nozzle XY coordinates before
    #    moving Z toward the bed to avoid crashing the nozzle."
    #
    # The important detail:
    #   → homed_axes IS valid in a standalone G28 Z call.
    #   → But NOT valid during G28 ALL (which is why we handled that above).
    #
    # Therefore, the dependency check ONLY applies here.
    ######################################################################
    {% if do_z and not home_all %}
        {% set homed = printer.toolhead.homed_axes %}
        
        {% if ('x' in homed) and ('y' in homed) %}
            G1 X150 Y150 F9000     ; Move to safe center point
            G28 Z                  ; Home Z safely
            G1 Z10                 ; Lift to prevent dragging
        {% else %}
            {action_raise_error("Cannot home Z — X/Y not homed.")}
        {% endif %}
    {% endif %}


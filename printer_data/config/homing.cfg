##################################################
#                 -- Homing --                  
##################################################
[homing_override]
axes: xyz
gcode:
    # ------------------------------------------------------------
    # User-tunable safe Z-homing parameters (Beacon-style)
    # ------------------------------------------------------------
    {% set safe_x = 150 %}
    {% set safe_y = 150 %}
    {% set z_hop  = 3 %}

    # ------------------------------------------------------------
    # Determine which axes the user requested to home
    # ------------------------------------------------------------
    {% set do_x = 'X' in params %}
    {% set do_y = 'Y' in params %}
    {% set do_z = 'Z' in params %}
    {% set home_all = (not do_x and not do_y and not do_z) %}

    G90  ; absolute positioning


    ######################################################################
    # 1) HOME ALL (G28)
    ######################################################################
    {% if home_all %}
        G28 Y                                  ; Home Y first
        G28 X                                  ; Then X

        G1 X{safe_x} Y{safe_y} F9000           ; Move to safe XY for Z
        G91
        G1 Z{z_hop} F600                       ; Z-hop before probing
        G90

        G28 Z                                  ; Home Z safely

        G91
        G1 Z{z_hop} F600                       ; Z-hop after homing
        G90
    {% endif %}


    ######################################################################
    # 2) HOME X ONLY (G28 X)
    ######################################################################
    {% if do_x and not home_all %}
        {% if 'y' in printer.toolhead.homed_axes %}
            G28 X
        {% else %}
            {action_raise_error("Cannot home X — Y not homed.")}
        {% endif %}
    {% endif %}


    ######################################################################
    # 3) HOME Y ONLY (G28 Y)
    ######################################################################
    {% if do_y and not home_all %}
        G28 Y
    {% endif %}


    ######################################################################
    # 4) HOME Z ONLY (G28 Z)
    ######################################################################
    {% if do_z and not home_all %}
        {% set homed = printer.toolhead.homed_axes %}
        {% if ('x' in homed) and ('y' in homed) %}

            G1 X{safe_x} Y{safe_y} F9000       ; Safe XY position
            G91
            G1 Z{z_hop} F600                   ; Z-hop before probing
            G90

            G28 Z                              ; Home Z

            G91
            G1 Z{z_hop} F600                   ; Z-hop after homing
            G90

        {% else %}
            {action_raise_error("Cannot home Z — X/Y not homed.")}
        {% endif %}
    {% endif %}
